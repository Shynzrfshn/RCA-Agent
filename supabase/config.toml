# Supabase CLI config. Fill in project_id with your project ref, or run
# `supabase link --project-ref <ref>` and the CLI will use that instead.
project_id = "lzzouujpprldgvznjouv"

# Functions that authenticate themselves (cron secret, signed tokens, or a
# manual JWT check) so the gateway must not require a JWT.
[functions.tick]
verify_jwt = false

[functions.gmail-sync]
verify_jwt = false

[functions.gmail-auth]
verify_jwt = false

[functions.push-action]
verify_jwt = false

[functions.agent]
verify_jwt = true

[auth]
additional_redirect_urls = ["https://shynzrfshn.github.io/RCA-Agent/**", "http://localhost:3000/**", "http://localhost:3001/**"]
site_url = "https://shynzrfshn.github.io/RCA-Agent/"

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.sms]
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.vector]
enabled = false
